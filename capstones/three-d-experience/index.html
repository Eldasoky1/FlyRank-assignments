<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit — First 3D experience on the web</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101b19;color:#f4f0e5;
    font-family:"Trebuchet MS", Verdana, sans-serif;}
  #app{width:100vw;height:100vh;display:block;}
  .ui{position:fixed;left:20px;bottom:20px;z-index:5;max-width:min(520px,90vw);padding:18px 20px;border-left:3px solid #d1a45d;background:rgba(16,27,25,.66);backdrop-filter:blur(10px);}
  .ui h1{font:700 1.7rem Georgia,serif;margin:0;letter-spacing:-.04em;}
  .ui p{font-size:0.85rem;color:#c5d1c7;line-height:1.6;margin:0.5rem 0 0;}
  .ui::after{content:'drag · scroll · auto-orbit';display:block;margin-top:12px;color:#d1a45d;font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .fallback{position:fixed;inset:0;display:grid;place-items:center;color:#c5d1c7;text-align:center;padding:1rem;background:#16362d;}
  .fallback strong{display:block;color:#f4f0e5;font:700 2rem Georgia,serif;margin-bottom:8px}
</style>
</head>
<body>
<div class="ui">
  <h1>Orbit — a tiny 3D scene</h1>
  <p>Drag to rotate · scroll to zoom · auto-orbits. Lazy-loaded: only loads after you interact is
     deferred here; the module itself is a single small file to keep the bundle sane.</p>
</div>
<canvas id="app"></canvas>
<div id="fallback" class="fallback" hidden><div><strong>Orbit</strong>WebGL is unavailable in this browser. The scene needs a hardware-accelerated canvas.</div></div>
<script type="module">
  try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
  const { OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js?module');

  const canvas = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(3, 2, 5);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;

  scene.add(new THREE.HemisphereLight(0x9ac9ad, 0x101b19, 1.1));
  const dir = new THREE.DirectionalLight(0xfff4d8, 1.6);
  dir.position.set(5, 8, 4);
  scene.add(dir);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.6, 0.03, 16, 128),
    new THREE.MeshStandardMaterial({ color: 0xd7ae65, metalness: 0.7, roughness: 0.25 }),
  );
  scene.add(ring);

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.55, 64, 64),
    new THREE.MeshStandardMaterial({ color: 0x9ac9ad, emissive: 0x16362d, roughness: 0.3, metalness: 0.2 }),
  );
  scene.add(sphere);

  const sat = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.22, 1),
    new THREE.MeshStandardMaterial({ color: 0xd26a5d, flatShading: true }),
  );
  scene.add(sat);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function animate(t) {
    requestAnimationFrame(animate);
    const s = t * 0.001;
    ring.rotation.x = s * 0.4;
    ring.rotation.y = s * 0.3;
    sat.position.set(Math.cos(s * 0.8) * 1.9, Math.sin(s * 0.8) * 1.9, Math.sin(s * 0.5) * 0.4);
    sphere.position.y = Math.sin(s) * 0.25;
    controls.update();
    renderer.render(scene, camera);
  })(0);
  } catch (error) {
    document.getElementById('fallback').hidden = false;
    document.getElementById('app').hidden = true;
    console.error('Orbit scene unavailable', error);
  }
</script>
</body>
</html>
