[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-mcp"
version = "0.1.0"
description = "MCP server for the FlyRank AI Internship portal (configuration-driven endpoint discovery + submission tools)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]
license = { text = "MIT" }

[project.scripts]
flyrank-mcp = "flyrank_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flyrank_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]