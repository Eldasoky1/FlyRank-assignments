name: flyrank-capstone-metering-billing
title: Usage Metering & Billing Engine
run: python -m uvicorn main:app --reload --port 8000
seed: python seed.py
test: python -m pytest -q
base_url: http://127.0.0.1:8000
endpoints:
  - path: /health
    method: GET
    description: Liveness probe
  - path: /v1/usage
    method: POST
    description: Meter a usage event (requires Idempotency-Key header)
  - path: /v1/usage
    method: GET
    description: Usage summary per customer
  - path: /generate
    method: POST
    description: Dummy billable endpoint recording API calls + AI tokens
  - path: /checkout
    method: GET
    description: Create a Stripe Checkout session (test mode)
  - path: /webhooks/stripe
    method: POST
    description: Stripe webhook (signature verified, deduped)
